<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TauriFoundation</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <main class="container">
      <h1>Tauri Foundation</h1>
      <p class="subtitle">
        Cross-platform desktop foundation — Windows, macOS, Linux (x64 and ARM64).
      </p>

      <form class="row" id="greet-form">
        <input id="greet-input" placeholder="Enter a name..." />
        <button type="submit">Greet</button>
      </form>
      <p id="greet-msg"></p>

      <p class="note">
        The greeting is produced by the Rust backend through Tauri's IPC
        bridge — if it answers, the full stack (webview UI &harr; Rust core)
        is working.
      </p>
    </main>
  </body>
</html>
